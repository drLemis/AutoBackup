name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: AutoBackup-windows-x64.exe
            asset_path: dist/AutoBackup.exe
          - os: ubuntu-latest
            asset_name: AutoBackup-linux-x64
            asset_path: dist/AutoBackup
          - os: macos-latest
            asset_name: AutoBackup-macos-x64.zip
            asset_path: dist/AutoBackup.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller AutoBackup.spec --noconfirm

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: Move-Item -Path dist/AutoBackup.exe -Destination dist/${{ matrix.asset_name }} -Force

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/AutoBackup
          mv dist/AutoBackup dist/${{ matrix.asset_name }}

      - name: Prepare artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc dist/AutoBackup.app dist/AutoBackup.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AutoBackup-*
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
